# =====================================================================
#  Wincors SMP - POWERS  (edit freely, then /wincors reload)
# =====================================================================
#  Each origin has up to 10 powers. The number is the POWER TIER that
#  unlocks it (tier = your mana, 1-10).
#
#  icon: optional item shown in the power menu (any item name, e.g. BLAZE_POWDER)
#  type: POTION   -> always-on potion effect       (effect, amplifier)
#  type: FLAG     -> special passive               (flag)
#       flags: NO_FALL, LIFESTEAL, FIRE_TOUCH, FROST_TOUCH, BONUS_DAMAGE,
#              REFLECT, LAST_STAND, DODGE, FREEZE_IMMUNE
#       (their numbers are in config.yml under "flags:")
#  type: ACTIVE   -> power you trigger             (cooldown seconds + actions)
#
#  An ACTIVE power runs its "actions" list in order. Action types and keys:
#   NOVA         radius, damage, knockback, fire-ticks, freeze-ticks, particle, sound, effects
#   BUFF         particle, sound, effects                       (applies to you)
#   DASH         speed, up, particle, sound, effects            (movement)
#   LAUNCH       strength, particle, sound, effects             (movement)
#   BLINK        distance, particle, effects                    (teleport)
#   STRIKE       range, radius, damage, lightning, fire-ticks, particle, sound, style (beam|meteor), effects
#                (lightning: true draws a real jagged bolt)
#   HEAL         amount, effects
#   PULL         radius, strength, particle, effects
#   FIREBALLS    count
#   FREEZE_ALL   radius, seconds
#   LIGHTNING_FX radius
#   WINGS        particle, seconds                              (glowing wings on your back)
#   HALO         particle, seconds                              (spinning halo above your head)
#   NO_FALL      seconds                                        (fall-damage immunity)
#
#  effects use the format  "EFFECT:seconds:amplifier"  e.g. "SLOWNESS:4:1"
#  (amplifier 0 = level I). Effect, particle and sound names are the vanilla
#  names in CAPS (SLOWNESS, FLAME, ENTITY_BLAZE_SHOOT ...). Invalid entries are
#  skipped and reported in the console.
# =====================================================================

